services:
  - type: web
    name: kazanacagiz
    env: python
    buildCommand: pip install -r requirements.txt && python backend/database.py && python backend/seed.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
